[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "ValutaTrade Hub — консольная платформа для симуляции торговли фиатными и криптовалютами"
readme = "README.md"
authors = [{ name = "Дарья Арент", email = "dashaarent@icloud.com" }]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.0",
    "requests>=2.31",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"
valutatrade = "valutatrade_hub.cli.interface:main"
parser-service = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

# Конфигурация приложения (читается SettingsLoader)
[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_max_bytes = 1048576
log_backup_count = 5
